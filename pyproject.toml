[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-race-gateway"
version = "0.1.0"
description = "LiteLLM proxy that ranks OpenAI-compatible routes by time to first token, fails over inside a first-token window and races a share of requests"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["litellm[proxy]==1.106.0"]

[project.scripts]
llm-race-gateway = "llm_race_gateway.cli:main"

[tool.setuptools]
packages = ["llm_race_gateway"]
